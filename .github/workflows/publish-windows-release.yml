name: Publish verified Windows release

on:
  workflow_dispatch:
    inputs:
      verification_run_id:
        description: Successful Build Windows FLASH verification run id
        required: true
        type: string
      source_commit:
        description: Full source commit from the verified run
        required: true
        type: string
      artifact_sha256:
        description: SHA-256 of the downloaded verification ZIP artifact
        required: true
        type: string
      version:
        description: Formal version already present in the verified artifact
        required: true
        type: string
      confirm_release:
        description: Confirm this formal release publication
        required: true
        type: boolean
        default: false

permissions:
  actions: read
  contents: write

concurrency:
  group: formal-windows-release-latest
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.actor == 'limaple0324' &&
      inputs.confirm_release
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout verified main source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false

      - name: Validate formal release inputs
        shell: pwsh
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_ACTOR: ${{ github.actor }}
          RELEASE_CONFIRMATION: ${{ inputs.confirm_release }}
          RELEASE_VERIFICATION_RUN_ID: ${{ inputs.verification_run_id }}
          RELEASE_SOURCE_COMMIT: ${{ inputs.source_commit }}
          RELEASE_ARTIFACT_SHA256: ${{ inputs.artifact_sha256 }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          @'
          import os
          from core.release_identity import validate_formal_release_inputs

          validate_formal_release_inputs(
              ref=os.environ["RELEASE_REF"],
              actor=os.environ["RELEASE_ACTOR"],
              confirmation=os.environ["RELEASE_CONFIRMATION"],
              verification_run_id=os.environ["RELEASE_VERIFICATION_RUN_ID"],
              source_commit=os.environ["RELEASE_SOURCE_COMMIT"],
              artifact_sha256=os.environ["RELEASE_ARTIFACT_SHA256"],
              version=os.environ["RELEASE_VERSION"],
          )
          '@ | python -

      - name: Verify selected successful validation run
        shell: pwsh
        env:
          RELEASE_VERIFICATION_RUN_ID: ${{ inputs.verification_run_id }}
          RELEASE_SOURCE_COMMIT: ${{ inputs.source_commit }}
          RELEASE_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
          $run = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/${{ github.repository }}/actions/runs/$env:RELEASE_VERIFICATION_RUN_ID"
          if ($run.name -ne 'Build Windows FLASH' -or $run.conclusion -ne 'success') {
            throw 'The selected verification run did not succeed in the approved validation workflow.'
          }
          if ($run.head_branch -ne 'main' -or $run.head_sha -cne $env:RELEASE_SOURCE_COMMIT) {
            throw 'The selected verification run does not match the requested main source commit.'
          }
          $shortCommit = $env:RELEASE_SOURCE_COMMIT.Substring(0, 7).ToLowerInvariant()
          $candidateName = "FLASH-SP1+SP2+SP3-Windows-$env:RELEASE_VERSION-$shortCommit-validation"
          $artifacts = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/${{ github.repository }}/actions/runs/$env:RELEASE_VERIFICATION_RUN_ID/artifacts"
          $matchingArtifacts = @($artifacts.artifacts | Where-Object {
            $_.name -eq $candidateName -and -not $_.expired
          })
          if ($matchingArtifacts.Count -ne 1) {
            throw 'The selected verification run does not contain exactly one requested validation artifact.'
          }
          "CANDIDATE_ARTIFACT_NAME=$candidateName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Download selected verification artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.CANDIDATE_ARTIFACT_NAME }}
          run-id: ${{ inputs.verification_run_id }}
          github-token: ${{ github.token }}
          path: candidate

      - name: Verify downloaded validation artifact without rebuilding
        shell: pwsh
        env:
          RELEASE_ARTIFACT_SHA256: ${{ inputs.artifact_sha256 }}
          RELEASE_SOURCE_COMMIT: ${{ inputs.source_commit }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $zipFiles = @(Get-ChildItem -LiteralPath candidate -Recurse -Filter '*.zip' -File)
          if ($zipFiles.Count -ne 1) {
            throw 'The downloaded validation artifact must contain exactly one ZIP file.'
          }
          $candidateZip = $zipFiles[0]
          $actualArtifactHash = (Get-FileHash -LiteralPath $candidateZip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualArtifactHash -cne $env:RELEASE_ARTIFACT_SHA256.ToLowerInvariant()) {
            throw 'The downloaded validation artifact SHA-256 does not match the release input.'
          }
          $extractRoot = Join-Path $env:RUNNER_TEMP 'verified-candidate'
          Expand-Archive -LiteralPath $candidateZip.FullName -DestinationPath $extractRoot
          $buildInfoPath = Get-ChildItem -LiteralPath $extractRoot -Recurse -Filter 'BUILD_INFO.txt' -File | Select-Object -First 1 -ExpandProperty FullName
          if ([string]::IsNullOrWhiteSpace($buildInfoPath)) {
            throw 'The downloaded validation artifact has no BUILD_INFO.txt.'
          }
          $env:CANDIDATE_BUILD_INFO = $buildInfoPath
          @'
          import os
          from core.release_identity import read_key_value_file, validate_verification_candidate_identity

          validate_verification_candidate_identity(
              read_key_value_file(os.environ["CANDIDATE_BUILD_INFO"]),
              expected_version=os.environ["RELEASE_VERSION"],
              expected_commit=os.environ["RELEASE_SOURCE_COMMIT"],
          )
          '@ | python -
          $candidateRoot = Split-Path -Parent (Split-Path -Parent $buildInfoPath)
          "CANDIDATE_ROOT=$candidateRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Check formal branch and complete release history
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_SOURCE_COMMIT: ${{ inputs.source_commit }}
          RELEASE_ARTIFACT_SHA256: ${{ inputs.artifact_sha256 }}
          RELEASE_VERIFICATION_RUN_ID: ${{ inputs.verification_run_id }}
        run: |
          $publishRoot = Join-Path $env:RUNNER_TEMP 'formal-release-branch'
          git clone --no-checkout "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" $publishRoot
          if ($LASTEXITCODE -ne 0) { throw 'Could not clone the formal release repository.' }
          Set-Location $publishRoot
          $remoteCheck = & git ls-remote --exit-code --heads origin release/latest 2>&1
          $remoteCheckExitCode = $LASTEXITCODE
          if ($remoteCheckExitCode -eq 0) {
            & git fetch --no-tags origin 'refs/heads/release/latest:refs/remotes/origin/release/latest'
            if ($LASTEXITCODE -ne 0) { throw 'Could not fetch the existing release/latest branch.' }
            & git checkout -B release/latest refs/remotes/origin/release/latest
            if ($LASTEXITCODE -ne 0) { throw 'Could not check out the existing release/latest branch.' }
            $branchExists = 'true'
          }
          elseif ($remoteCheckExitCode -eq 2) {
            & git checkout --orphan release/latest
            if ($LASTEXITCODE -ne 0) { throw 'Could not create the first release/latest branch.' }
            $branchExists = 'false'
          }
          else {
            throw "Could not determine whether release/latest exists: $remoteCheck"
          }
          $historyPath = Join-Path $publishRoot 'RELEASE_HISTORY.jsonl'
          if ($branchExists -eq 'true' -and -not (Test-Path -LiteralPath $historyPath -PathType Leaf)) {
            throw 'Existing release/latest has no retained formal release history.'
          }
          $env:RELEASE_HISTORY_PATH = $historyPath
          $env:RELEASE_ARTIFACT_NAME = "FLASH-SP1+SP2+SP3-Windows-$env:RELEASE_VERSION-$($env:RELEASE_SOURCE_COMMIT.Substring(0, 7).ToLowerInvariant())-release"
          @'
          import os
          from core.release_identity import read_release_history, reject_reused_release_history_version

          reject_reused_release_history_version(
              current_version=os.environ["RELEASE_VERSION"],
              current_commit=os.environ["RELEASE_SOURCE_COMMIT"],
              history=read_release_history(os.environ["RELEASE_HISTORY_PATH"]),
          )
          '@ | python -
          "PUBLISH_ROOT=$publishRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Compose formal release from verified artifact
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_SOURCE_COMMIT: ${{ inputs.source_commit }}
          RELEASE_ARTIFACT_SHA256: ${{ inputs.artifact_sha256 }}
          RELEASE_VERIFICATION_RUN_ID: ${{ inputs.verification_run_id }}
        run: |
          $bundleRoot = Join-Path $env:RUNNER_TEMP 'formal-release-bundle'
          Remove-Item -LiteralPath $bundleRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $bundleRoot | Out-Null
          Copy-Item (Join-Path $env:CANDIDATE_ROOT '*') $bundleRoot -Recurse -Force
          Get-ChildItem -LiteralPath $bundleRoot -Filter '*說明.txt' -File | Remove-Item -Force
          $systemRoot = Join-Path $bundleRoot '輔系統'
          Copy-Item 'tools/安裝輔.cmd' (Join-Path $bundleRoot '安裝輔.cmd')
          Copy-Item 'tools/更新輔.cmd' (Join-Path $bundleRoot '更新輔.cmd')
          Copy-Item 'tools/輔系統/安裝輔.ps1' (Join-Path $systemRoot '安裝輔.ps1')
          Copy-Item 'tools/輔系統/輔更新核心.ps1' (Join-Path $systemRoot '輔更新核心.ps1')
          Copy-Item 'tools/檢查輔同步狀態.cmd' (Join-Path $systemRoot '檢查輔同步狀態.cmd')
          Copy-Item 'tools/檢查輔同步狀態.ps1' (Join-Path $systemRoot '檢查輔同步狀態.ps1')
          @(
            '* -text'
            '*.cmd -text'
            '*.bat -text'
            '*.ps1 -text'
            '*.txt -text'
          ) | Set-Content (Join-Path $bundleRoot '.gitattributes') -Encoding ascii
          $shortCommit = $env:RELEASE_SOURCE_COMMIT.Substring(0, 7).ToLowerInvariant()
          $builtUtc = [DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ')
          "FORMAL_RELEASED_UTC=$builtUtc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $exeHash = (Get-FileHash -LiteralPath (Join-Path $bundleRoot 'FLASH.exe') -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            'product=輔'
            'technical_name=FLASH'
            "version=$env:RELEASE_VERSION"
            'milestone=SP3'
            'build_kind=main_release'
            'artifact_kind=release'
            'event_name=workflow_dispatch'
            'source_ref=refs/heads/main'
            'source_branch=main'
            'publish_target=release/latest'
            'approval_status=approved'
            'approval_method=workflow_dispatch_input'
            'approval_actor=${{ github.actor }}'
            "approval_run_id=$env:GITHUB_RUN_ID"
            'approval_event=workflow_dispatch'
            "commit=$env:RELEASE_SOURCE_COMMIT"
            "short_commit=$shortCommit"
            "run_id=$env:GITHUB_RUN_ID"
            "built_utc=$builtUtc"
            "artifact_name=$env:RELEASE_ARTIFACT_NAME"
            "python=$(python --version 2>&1)"
            "sha256=$exeHash"
            "verification_run_id=$env:RELEASE_VERIFICATION_RUN_ID"
            "verification_artifact_name=FLASH-SP1+SP2+SP3-Windows-$env:RELEASE_VERSION-$shortCommit-validation"
            "verification_artifact_sha256=$env:RELEASE_ARTIFACT_SHA256"
          ) | Set-Content (Join-Path $systemRoot 'BUILD_INFO.txt') -Encoding utf8
          @(
            'release_branch=release/latest'
            'source_branch=main'
            'build_kind=main_release'
            'publish_target=release/latest'
          ) | Set-Content (Join-Path $systemRoot 'UPDATE_CHANNEL.txt') -Encoding utf8
          @(
            'branch=main'
            "version=$env:RELEASE_VERSION"
            "commit=$env:RELEASE_SOURCE_COMMIT"
            "short_commit=$shortCommit"
            "run_id=$env:GITHUB_RUN_ID"
            "artifact_name=$env:RELEASE_ARTIFACT_NAME"
            'approval_status=approved'
            'approval_method=workflow_dispatch_input'
            'approval_actor=${{ github.actor }}'
            "approval_run_id=$env:GITHUB_RUN_ID"
            'approval_event=workflow_dispatch'
            "approved_utc=$builtUtc"
            "updated_utc=$builtUtc"
          ) | Set-Content (Join-Path $bundleRoot 'LATEST.txt') -Encoding utf8
          $manifestPaths = @(
            'FLASH.exe', 'LATEST.txt', '安裝輔.cmd', '更新輔.cmd',
            '輔系統/BUILD_INFO.txt', 'sync_plus_icon.ico',
            '輔系統/verify_windows_release.ps1', '輔系統/安裝輔.ps1',
            '輔系統/輔更新核心.ps1', '輔系統/UPDATE_CHANNEL.txt',
            '輔系統/檢查輔同步狀態.cmd', '輔系統/檢查輔同步狀態.ps1'
          )
          @(
            foreach ($relativePath in $manifestPaths) {
              $fileHash = (Get-FileHash -LiteralPath (Join-Path $bundleRoot $relativePath) -Algorithm SHA256).Hash.ToLowerInvariant()
              "$fileHash  $relativePath"
            }
          ) | Set-Content (Join-Path $systemRoot 'SHA256SUMS.txt') -Encoding utf8
          & (Join-Path $systemRoot 'verify_windows_release.ps1') -NoLaunch
          if ($LASTEXITCODE -ne 0) { throw 'Formal release identity verification failed.' }
          "FORMAL_BUNDLE_ROOT=$bundleRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Append release history and update formal branch
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_SOURCE_COMMIT: ${{ inputs.source_commit }}
          RELEASE_ARTIFACT_SHA256: ${{ inputs.artifact_sha256 }}
          RELEASE_VERIFICATION_RUN_ID: ${{ inputs.verification_run_id }}
        run: |
          Get-ChildItem -LiteralPath $env:PUBLISH_ROOT -Force |
            Where-Object { $_.Name -notin @('.git', 'RELEASE_HISTORY.jsonl') } |
            Remove-Item -Recurse -Force
          Copy-Item (Join-Path $env:FORMAL_BUNDLE_ROOT '*') $env:PUBLISH_ROOT -Recurse -Force
          $env:RELEASE_HISTORY_PATH = Join-Path $env:PUBLISH_ROOT 'RELEASE_HISTORY.jsonl'
          $env:RELEASE_ARTIFACT_NAME = "FLASH-SP1+SP2+SP3-Windows-$env:RELEASE_VERSION-$($env:RELEASE_SOURCE_COMMIT.Substring(0, 7).ToLowerInvariant())-release"
          @'
          import json
          import os
          from core.release_identity import read_release_history, reject_reused_release_history_version

          history_path = os.environ["RELEASE_HISTORY_PATH"]
          history = read_release_history(history_path)
          reject_reused_release_history_version(
              current_version=os.environ["RELEASE_VERSION"],
              current_commit=os.environ["RELEASE_SOURCE_COMMIT"],
              history=history,
          )
          entry = {
              "version": os.environ["RELEASE_VERSION"],
              "commit": os.environ["RELEASE_SOURCE_COMMIT"],
              "sha256": os.environ["RELEASE_ARTIFACT_SHA256"],
              "artifact_name": os.environ["RELEASE_ARTIFACT_NAME"],
              "verification_run_id": os.environ["RELEASE_VERIFICATION_RUN_ID"],
              "verification_artifact_sha256": os.environ["RELEASE_ARTIFACT_SHA256"],
              "released_utc": os.environ["FORMAL_RELEASED_UTC"],
          }
          with open(history_path, "a", encoding="utf-8", newline="\n") as stream:
              stream.write(json.dumps(entry, sort_keys=True) + "\n")
          read_release_history(history_path)
          '@ | python -
          Set-Location $env:PUBLISH_ROOT
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "Publish verified Windows FLASH $env:RELEASE_VERSION"
          if ($LASTEXITCODE -ne 0) { throw 'Could not create the formal release commit.' }
          git push origin HEAD:release/latest
          if ($LASTEXITCODE -ne 0) { throw 'Formal release branch update was not a fast-forward push.' }

      - name: Upload formal release artifact
        shell: pwsh
        run: |
          $outputRoot = Join-Path $env:RUNNER_TEMP 'formal-release-output'
          New-Item -ItemType Directory -Force -Path $outputRoot | Out-Null
          $zipPath = Join-Path $outputRoot "$env:RELEASE_ARTIFACT_NAME.zip"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [IO.Compression.ZipFile]::CreateFromDirectory(
            $env:FORMAL_BUNDLE_ROOT,
            $zipPath,
            [IO.Compression.CompressionLevel]::Optimal,
            $false
          )
          $zipHash = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$zipHash  $([IO.Path]::GetFileName($zipPath))" | Set-Content "$zipPath.sha256.txt" -Encoding ascii
          "FORMAL_ARTIFACT_OUTPUT=$outputRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Store formal release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_ARTIFACT_NAME }}
          path: ${{ env.FORMAL_ARTIFACT_OUTPUT }}/*
          if-no-files-found: error
          retention-days: 30
