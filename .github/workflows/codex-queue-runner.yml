name: Codex Queue Runner

on:
  issue_comment:
    types: [created]
  schedule:
    - cron: "*/20 * * * *"
  repository_dispatch:
    types: [codex_queue_next]
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run 或 live"
        required: false
        default: dry-run
        type: choice
        options: [dry-run, live]
      queue_id:
        description: "指定 QUEUE_ID（選填）"
        required: false
        type: string
      allow_writeback:
        description: "只允許手動 live 回寫"
        required: false
        default: false
        type: boolean

concurrency:
  group: codex-queue-runner-global
  cancel-in-progress: false

jobs:
  select_claim:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (vars.CODEX_QUEUE_ENABLED == 'true' &&
       (github.event_name != 'issue_comment' || github.event.issue.number == 19))
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      issues: write
      pull-requests: read
      actions: read
    outputs:
      selected: ${{ steps.result.outputs.selected }}
      mode: ${{ steps.result.outputs.mode }}
      role: ${{ steps.result.outputs.role }}
      base_commit: ${{ steps.result.outputs.base_commit }}
      allow_writeback: ${{ steps.result.outputs.allow_writeback }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          path: runner-src
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: 選取、核對與認領
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          OPENAI_SECRET_AVAILABLE: ${{ secrets.OPENAI_API_KEY != '' }}
          QUEUE_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'live' }}
          QUEUE_ID: ${{ inputs.queue_id || '' }}
          ALLOW_WRITEBACK: ${{ github.event_name != 'workflow_dispatch' || inputs.allow_writeback }}
        run: |
          fixture=""
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$QUEUE_MODE" = "dry-run" ]; then
            fixture="$GITHUB_WORKSPACE/runner-src/tests/fixtures/codex_queue_dry_task.txt"
          fi
          PYTHONPATH="$GITHUB_WORKSPACE/runner-src" python -m automation.codex_queue_runner.cli select-claim --event "$GITHUB_EVENT_PATH" --output-dir select-output --repository "$GITHUB_REPOSITORY" --mode "$QUEUE_MODE" --queue-id "$QUEUE_ID" --allow-writeback "$ALLOW_WRITEBACK" --fixture "$fixture"
      - id: result
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          value = json.loads(Path("select-output/selection.json").read_text(encoding="utf-8"))
          fields = {"selected": str(bool(value.get("selected"))).lower(), "mode": value.get("mode", ""), "role": value.get("task", {}).get("role", ""), "base_commit": value.get("task", {}).get("base_commit", ""), "allow_writeback": str(bool(value.get("allow_writeback"))).lower()}
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as out:
              for key, item in fields.items(): out.write(f"{key}={item}\n")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: queue-context
          path: select-output
          retention-days: 1

  agent:
    needs: select_claim
    if: needs.select_claim.outputs.selected == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      final_message: ${{ steps.codex.outputs.final-message || steps.fixture.outputs.final_message }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          path: runner-src
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.select_claim.outputs.base_commit }}
          path: target-repo
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: queue-context
          path: agent-input
      - name: 建立提示與輸出架構
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/runner-src" python -m automation.codex_queue_runner.cli render-prompt --task agent-input/task.json --context agent-input/context.json --output "$RUNNER_TEMP/codex-prompt.md"
          PYTHONPATH="$GITHUB_WORKSPACE/runner-src" python -m automation.codex_queue_runner.cli write-schema --task agent-input/task.json --output "$RUNNER_TEMP/codex-schema.json"
      - id: fixture
        if: needs.select_claim.outputs.mode == 'dry-run' || needs.select_claim.outputs.role == 'TEST_VALIDATION'
        run: PYTHONPATH="$GITHUB_WORKSPACE/runner-src" python -m automation.codex_queue_runner.cli dry-agent-output --task agent-input/task.json --github-output "$GITHUB_OUTPUT"
      - id: codex
        if: >-
          needs.select_claim.outputs.mode == 'live' &&
          (needs.select_claim.outputs.role == 'WORKER_A' || needs.select_claim.outputs.role == 'REQUIREMENTS_AUDIT' || needs.select_claim.outputs.role == 'CODE_REVIEW')
        uses: openai/codex-action@b11346a6fa031e2e164ab4b7c7ea201afffd7d59
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          sandbox: ${{ needs.select_claim.outputs.role == 'WORKER_A' && 'workspace-write' || 'read-only' }}
          safety-strategy: drop-sudo
          codex-version: "0.146.0"
          codex-args: '["--ephemeral", "--ignore-user-config"]'
          prompt-file: ${{ runner.temp }}/codex-prompt.md
          output-schema-file: ${{ runner.temp }}/codex-schema.json
          working-directory: ${{ github.workspace }}/target-repo

  validate:
    needs: [select_claim, agent]
    if: always() && needs.select_claim.outputs.selected == 'true' && needs.agent.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          path: runner-src
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.select_claim.outputs.base_commit }}
          path: target-repo
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: queue-context
          path: validate-input
      - name: 驗證結構化輸出與實際差異
        env:
          AGENT_FINAL_MESSAGE: ${{ needs.agent.outputs.final_message }}
        run: PYTHONPATH="$GITHUB_WORKSPACE/runner-src" python -m automation.codex_queue_runner.cli validate --task validate-input/task.json --target-repo "$GITHUB_WORKSPACE/target-repo" --agent-output "$AGENT_FINAL_MESSAGE" --output-dir validated-output
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: validated-output
          path: validated-output
          retention-days: 1

  push_writeback:
    needs: [select_claim, validate]
    if: >-
      always() && needs.select_claim.outputs.selected == 'true' &&
      (needs.select_claim.outputs.mode == 'dry-run' || needs.select_claim.outputs.allow_writeback == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          path: runner-src
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.select_claim.outputs.base_commit }}
          path: target-repo
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: queue-context
          path: writeback-input
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: validated-output
          path: writeback-input/validated
      - name: 一次性認證推送或乾跑回寫
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          QUEUE_MODE: ${{ needs.select_claim.outputs.mode }}
        run: |
          if [ "$QUEUE_MODE" = "live" ]; then
            encoded="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w 0)"
            export GIT_CONFIG_COUNT=1
            export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
            export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $encoded"
          fi
          set +e
          PYTHONPATH="$GITHUB_WORKSPACE/runner-src" python -m automation.codex_queue_runner.cli writeback --task writeback-input/task.json --validated-dir writeback-input/validated --target-repo "$GITHUB_WORKSPACE/target-repo" --repository "$GITHUB_REPOSITORY" --mode "$QUEUE_MODE" --report dry-run-report.json
          code=$?
          unset GITHUB_TOKEN GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0 encoded
          exit $code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: needs.select_claim.outputs.mode == 'dry-run'
        with:
          name: dry-run-report
          path: dry-run-report.json
          retention-days: 1
