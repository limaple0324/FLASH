name: Codex Queue Runner

on:
  issue_comment:
    types: [created]
  schedule:
    - cron: "*/20 * * * *"
  repository_dispatch:
    types: [codex_queue_next]
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run 或 live"
        required: false
        default: dry-run
        type: choice
        options: [dry-run, live]
      queue_id:
        description: "指定 QUEUE_ID（選填）"
        required: false
        type: string
      allow_writeback:
        description: "允許 live 狀態回寫與一般推送"
        required: false
        default: false
        type: boolean

concurrency:
  group: codex-queue-runner-global
  cancel-in-progress: false

jobs:
  select_claim:
    if: >-
      (github.event_name == 'workflow_dispatch' || vars.CODEX_QUEUE_ENABLED == 'true') &&
      (github.event_name != 'issue_comment' || github.event.issue.number == 19)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: read
    outputs:
      selected: ${{ steps.result.outputs.selected }}
      role: ${{ steps.result.outputs.role }}
      sandbox: ${{ steps.result.outputs.sandbox }}
      base_commit: ${{ steps.result.outputs.base_commit }}
      mode: ${{ steps.result.outputs.mode }}
      allow_writeback: ${{ steps.result.outputs.allow_writeback }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 選取、核對並認領
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          CODEX_QUEUE_ENABLED: ${{ vars.CODEX_QUEUE_ENABLED }}
          OPENAI_SECRET_AVAILABLE: ${{ secrets.OPENAI_API_KEY != '' }}
          QUEUE_MODE: ${{ inputs.mode || 'live' }}
          QUEUE_ID: ${{ inputs.queue_id || '' }}
          ALLOW_WRITEBACK: ${{ inputs.allow_writeback || false }}
        run: |
          python -m automation.codex_queue_runner.cli select-claim --event "$GITHUB_EVENT_PATH" --output queue-task.json --repository "$GITHUB_REPOSITORY" --mode "$QUEUE_MODE" --queue-id "$QUEUE_ID" --allow-writeback "$ALLOW_WRITEBACK" --openai-secret-available "$OPENAI_SECRET_AVAILABLE"
      - id: result
        name: 輸出受信任任務摘要
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          item = json.loads(Path("queue-task.json").read_text(encoding="utf-8"))
          values = {"selected": str(bool(item.get("selected"))).lower(), "role": item.get("task", {}).get("role", ""), "sandbox": item.get("sandbox", ""), "base_commit": item.get("task", {}).get("base_commit", ""), "mode": item.get("mode", "dry-run"), "allow_writeback": str(bool(item.get("allow_writeback"))).lower()}
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              for key, value in values.items():
                  handle.write(f"{key}={value}\\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: claimed-task
          path: queue-task.json
          if-no-files-found: error
          retention-days: 1

  agent:
    needs: select_claim
    if: >-
      needs.select_claim.outputs.selected == 'true' && needs.select_claim.outputs.mode == 'live' &&
      (needs.select_claim.outputs.role == 'WORKER_A' || needs.select_claim.outputs.role == 'REQUIREMENTS_AUDIT' || needs.select_claim.outputs.role == 'CODE_REVIEW')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.select_claim.outputs.base_commit }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: claimed-task
          path: agent-input
      - name: 建立受限提示
        run: python -m automation.codex_queue_runner.cli render-prompt --task agent-input/queue-task.json --output "$RUNNER_TEMP/codex-prompt.md"
      - name: 執行官方 Codex 動作
        id: codex
        uses: openai/codex-action@b11346a6fa031e2e164ab4b7c7ea201afffd7d59
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          sandbox: ${{ needs.select_claim.outputs.sandbox }}
          safety-strategy: drop-sudo
          codex-version: "0.146.0"
          codex-args: '["--ephemeral", "--ignore-user-config"]'
          prompt-file: ${{ runner.temp }}/codex-prompt.md
          output-file: ${{ runner.temp }}/codex-final.md
      - name: 僅封裝代理產物
        env:
          BASE_COMMIT: ${{ needs.select_claim.outputs.base_commit }}
        run: |
          mkdir -p agent-output
          git diff --binary --no-ext-diff "$BASE_COMMIT" > agent-output/candidate.patch
          cp "$RUNNER_TEMP/codex-final.md" agent-output/codex-final.md
          cp agent-input/queue-task.json agent-output/task.json
          python -m automation.codex_queue_runner.cli write-agent-events --task agent-output/task.json --output agent-output/events.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: agent-output
          path: agent-output
          retention-days: 1

  validate:
    needs: [select_claim, agent]
    if: >-
      always() && needs.select_claim.outputs.selected == 'true' && needs.select_claim.outputs.mode == 'live' &&
      (needs.agent.result == 'success' || needs.select_claim.outputs.role == 'TEST_VALIDATION')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.select_claim.outputs.base_commit }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: claimed-task
          path: validate-input
      - uses: actions/download-artifact@v4
        if: needs.agent.result == 'success'
        with:
          name: agent-output
          path: validate-input/agent
      - name: 建立無 Codex 產物
        if: needs.agent.result != 'success'
        run: |
          mkdir -p validate-input/agent
          : > validate-input/agent/candidate.patch
          cp validate-input/queue-task.json validate-input/agent/task.json
      - name: 安裝基準測試依賴
        run: python -m pip install -r requirements.txt
      - name: 驗證真實差異與受控測試
        run: python -m automation.codex_queue_runner.cli validate --task validate-input/agent/task.json --patch validate-input/agent/candidate.patch --output-dir validated-output
      - uses: actions/upload-artifact@v4
        with:
          name: validated-output
          path: validated-output
          retention-days: 1

  push_writeback:
    needs: [select_claim, validate]
    if: >-
      always() && needs.select_claim.outputs.selected == 'true' && needs.select_claim.outputs.mode == 'live' && needs.select_claim.outputs.allow_writeback == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.select_claim.outputs.base_commit }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: claimed-task
          path: writeback-input
      - uses: actions/download-artifact@v4
        if: needs.validate.result == 'success'
        with:
          name: validated-output
          path: writeback-input/validated
      - name: 僅建立固定父提交、一般推送與回寫
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
        run: python -m automation.codex_queue_runner.cli push-writeback --task writeback-input/queue-task.json --validated-dir writeback-input/validated --repository "$GITHUB_REPOSITORY" --validate-result "$VALIDATE_RESULT"
