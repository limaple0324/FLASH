name: package-fu-842e

on:
  push:
    branches:
      - package/fu-842e-20260904

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild and overlay reviewed runtime payload
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check brotli
          @'
          import brotli, hashlib, io, pathlib, tarfile
          parts_dir = pathlib.Path('.packaging/runtime_parts/bin')
          parts = sorted(parts_dir.glob('*.bin'))
          expected_names = [f'{i:03d}.bin' for i in range(26)]
          actual_names = [p.name for p in parts]
          if actual_names != expected_names:
              raise SystemExit(f'unexpected runtime bin parts: {actual_names!r}')
          packed = b''.join(p.read_bytes() for p in parts)
          packed_sha = hashlib.sha256(packed).hexdigest()
          print(f'rebuilt_runtime_bytes={len(packed)}')
          print(f'rebuilt_runtime_sha256={packed_sha}')
          pathlib.Path('.packaging/runtime_rebuilt.tar.br').write_bytes(packed)
          raw = brotli.decompress(packed)
          print(f'rebuilt_tar_bytes={len(raw)}')
          with tarfile.open(fileobj=io.BytesIO(raw), mode='r:') as tf:
              root = pathlib.Path('.').resolve()
              for member in tf.getmembers():
                  target = (root / member.name).resolve()
                  if root not in target.parents and target != root:
                      raise SystemExit(f'unsafe tar member: {member.name}')
              tf.extractall(root)
          pathlib.Path('.packaging/REBUILT_RUNTIME_SHA256.txt').write_text(packed_sha + '\n', encoding='utf-8')
          '@ | python -

      - name: Verify exact reviewed source tree
        shell: pwsh
        run: |
          @'
          import hashlib, json, pathlib
          root = pathlib.Path('.').resolve()
          manifest_path = root / 'SOURCE_MANIFEST.json'
          if not manifest_path.is_file():
              raise SystemExit('SOURCE_MANIFEST.json missing after overlay')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          expected_tree = '842e2b0021d8c374976b01ff81157a4992394c86c94eca8f668a2aab380e290a'
          if manifest.get('source_tree_sha256') != expected_tree:
              raise SystemExit(f"source_tree_sha256 mismatch: {manifest.get('source_tree_sha256')!r}")
          included = manifest.get('included')
          if not isinstance(included, list) or len(included) != 159 or manifest.get('included_count') != 159:
              raise SystemExit(f"unexpected manifest count: included={len(included) if isinstance(included, list) else None}, declared={manifest.get('included_count')!r}")
          failures = []
          for entry in included:
              rel = entry['path']
              p = root / rel
              if not p.is_file():
                  failures.append(f'{rel}: missing')
                  continue
              data = p.read_bytes()
              size = len(data)
              digest = hashlib.sha256(data).hexdigest()
              if size != int(entry['bytes']) or digest != entry['sha256']:
                  failures.append(f"{rel}: bytes={size}/{entry['bytes']} sha256={digest}/{entry['sha256']}")
          if failures:
              print('\n'.join(failures[:50]))
              raise SystemExit(f'exact reviewed source verification failed: {len(failures)} file(s)')
          print(f'Exact reviewed source verified: {len(included)} files, tree={expected_tree}')
          '@ | python -

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Compile check
        shell: pwsh
        run: |
          python -m compileall -q automation_input_safety.py control_panel.py fishing_profiles.py flash_sync_v02.py fu_reconnect_integration.py manor_runtime.py quick_code_library.py runtime_paths.py settings_bundle.py smart_reconnect.py user_activity_guard.py v02_faithful_game_time.py v02_game_clock_reader.py v02_sync_scheduler.py v02_wheel_hook.py manor_assistant

      - name: Build 輔魔.exe
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean fu_preview.spec
          if (-not (Test-Path 'dist/輔魔.exe')) { throw 'dist/輔魔.exe not produced' }
          $hash = (Get-FileHash 'dist/輔魔.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          $size = (Get-Item 'dist/輔魔.exe').Length
          $runtimeHash = (Get-Content '.packaging/REBUILT_RUNTIME_SHA256.txt' -Raw).Trim()
          "source_zip_sha256=748ea8dba2dd194e9d32567f6c0a115213f61b43ed6e99c7fde4fa100b160f68" | Out-File -Encoding utf8 'dist/BUILD_INFO.txt'
          "source_tree_sha256=842e2b0021d8c374976b01ff81157a4992394c86c94eca8f668a2aab380e290a" | Out-File -Encoding utf8 -Append 'dist/BUILD_INFO.txt'
          "base_commit=32ad4ae780c8c3b68c4a068aba3fb6c59977466f" | Out-File -Encoding utf8 -Append 'dist/BUILD_INFO.txt'
          "rebuilt_runtime_sha256=$runtimeHash" | Out-File -Encoding utf8 -Append 'dist/BUILD_INFO.txt'
          "exe_sha256=$hash" | Out-File -Encoding utf8 -Append 'dist/BUILD_INFO.txt'
          "exe_bytes=$size" | Out-File -Encoding utf8 -Append 'dist/BUILD_INFO.txt'
          Get-Content 'dist/BUILD_INFO.txt'

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: fu-magic-842e
          path: |
            dist/輔魔.exe
            dist/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 7
