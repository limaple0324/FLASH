name: package-fu-842e

on:
  push:
    branches:
      - package/fu-842e-20260904

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify and overlay reviewed runtime delta
        shell: pwsh
        run: |
          $expected = '2da532daa81f55ef59253793373982dd045feebfb347e76d505bcf16b66c4fc1'
          $actual = (Get-FileHash '.packaging/runtime_delta.tar.br' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "runtime delta SHA-256 mismatch: $actual" }
          python -m pip install --disable-pip-version-check brotli
          @'
          import brotli, io, pathlib, tarfile
          p = pathlib.Path('.packaging/runtime_delta.tar.br')
          raw = brotli.decompress(p.read_bytes())
          with tarfile.open(fileobj=io.BytesIO(raw), mode='r:') as tf:
              root = pathlib.Path('.').resolve()
              for member in tf.getmembers():
                  target = (root / member.name).resolve()
                  if root not in target.parents and target != root:
                      raise SystemExit(f'unsafe tar member: {member.name}')
              tf.extractall(root)
          '@ | python -

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Compile check
        shell: pwsh
        run: |
          python -m compileall -q automation_input_safety.py control_panel.py fishing_profiles.py flash_sync_v02.py fu_reconnect_integration.py manor_runtime.py quick_code_library.py runtime_paths.py settings_bundle.py smart_reconnect.py user_activity_guard.py v02_faithful_game_time.py v02_game_clock_reader.py v02_sync_scheduler.py v02_wheel_hook.py manor_assistant

      - name: Build 輔魔.exe
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean fu_preview.spec
          if (-not (Test-Path 'dist/輔魔.exe')) { throw 'dist/輔魔.exe not produced' }
          $hash = (Get-FileHash 'dist/輔魔.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          $size = (Get-Item 'dist/輔魔.exe').Length
          "source_zip_sha256=748ea8dba2dd194e9d32567f6c0a115213f61b43ed6e99c7fde4fa100b160f68" | Out-File -Encoding utf8 'dist/BUILD_INFO.txt'
          "source_tree_sha256=842e2b0021d8c374976b01ff81157a4992394c86c94eca8f668a2aab380e290a" | Out-File -Encoding utf8 -Append 'dist/BUILD_INFO.txt'
          "base_commit=32ad4ae780c8c3b68c4a068aba3fb6c59977466f" | Out-File -Encoding utf8 -Append 'dist/BUILD_INFO.txt'
          "exe_sha256=$hash" | Out-File -Encoding utf8 -Append 'dist/BUILD_INFO.txt'
          "exe_bytes=$size" | Out-File -Encoding utf8 -Append 'dist/BUILD_INFO.txt'
          Get-Content 'dist/BUILD_INFO.txt'

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: fu-magic-842e
          path: |
            dist/輔魔.exe
            dist/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 7
