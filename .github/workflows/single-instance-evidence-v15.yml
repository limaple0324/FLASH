name: Single Instance Evidence FU V15
on:
  push:
    branches: [repair/fumagic-ui-v11-20260906]
permissions:
  actions: read
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fumagic-842e2b-cumulative-live-fix-v15
          path: repaired
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 34129290304
      - name: Verify second launch cannot create another FU application instance
        shell: pwsh
        run: |
          $exe = Resolve-Path 'repaired/輔魔.exe'
          $first = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 5
          if ($first.HasExited) { throw "first FU exited unexpectedly: $($first.ExitCode)" }
          $before = @(Get-Process -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq $exe.Path })
          if ($before.Count -lt 1) { throw "no FU process found before second launch" }
          $beforeIds = @($before | ForEach-Object Id | Sort-Object)
          $second = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 3
          $second.Refresh()
          if (-not $second.HasExited) { throw "second launcher stayed alive pid=$($second.Id)" }
          $after = @(Get-Process -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq $exe.Path })
          $afterIds = @($after | ForEach-Object Id | Sort-Object)
          if ($after.Count -ne $before.Count) { throw "FU process count changed after second launch: before=$($before.Count) after=$($after.Count) beforeIds=$($beforeIds -join ',') afterIds=$($afterIds -join ',')" }
          if (($afterIds -join ',') -ne ($beforeIds -join ',')) { throw "original FU process set changed after second launch: beforeIds=$($beforeIds -join ',') afterIds=$($afterIds -join ',')" }
          Write-Host "SINGLE_INSTANCE_VERIFIED pyinstaller_processes=$($before.Count) first_pid=$($first.Id) second_pid=$($second.Id) second_exit=$($second.ExitCode) stable_ids=$($afterIds -join ',')"
          $after | Stop-Process -Force -ErrorAction SilentlyContinue
