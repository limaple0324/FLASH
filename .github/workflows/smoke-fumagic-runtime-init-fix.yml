name: Smoke FU Cumulative Live Fix 14
on:
  push:
    branches: [repair/fumagic-runtime-init-smoke-20260906]
permissions:
  actions: read
  contents: read
jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fumagic-842e2b-cumulative-live-fix-v14
          path: repaired
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 34120206403
      - name: Verify exact cumulative v14 executable
        shell: pwsh
        run: |
          $exe = Resolve-Path 'repaired/輔魔.exe'
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $exe).Hash.ToLowerInvariant()
          if ($hash -ne '0177afc08afb99f2233cc122532661cb00ec3a31e05f42ebddb646de551cbb00') { throw "SHA mismatch: $hash" }
          $size = (Get-Item -LiteralPath $exe).Length
          if ($size -ne 116526528) { throw "Size mismatch: $size" }
          Write-Host "CUMULATIVE_V14_EXE_VERIFIED sha256=$hash size=$size"
      - name: Launch exact cumulative v14 executable
        shell: pwsh
        run: |
          $exe = Resolve-Path 'repaired/輔魔.exe'
          Start-Process -FilePath $exe | Out-Null
          Start-Sleep -Seconds 12
          $live = @(Get-Process -Name '輔魔' -ErrorAction SilentlyContinue)
          if ($live.Count -lt 1) { throw 'No live 輔魔 process after 12 seconds.' }
          Write-Host ('SMOKE_PROCESS_ALIVE pids=' + (($live | ForEach-Object Id) -join ','))
          Write-Host 'SMOKE_CUMULATIVE_V14_PASS'
          $live | Stop-Process -Force -ErrorAction SilentlyContinue
