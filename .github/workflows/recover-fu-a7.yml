name: Package FU 842e2b

on:
  push:
    branches:
      - package/fu-recover-a7-20260905

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Diagnose recovered payload against exact 159-file manifest
        shell: pwsh
        run: |
          python -m pip install brotli
          @'
          import base64, brotli, hashlib, io, json, pathlib, tarfile
          repo = pathlib.Path.cwd()
          packaging = repo / '.packaging'
          b64_root = packaging / 'runtime24fresh_b64'
          fix_root = packaging / 'runtime24fresh_fix'
          source_root = repo / 'legacy' / 'fu-v02-reconnect-preview'
          fixed = {0, 1, 3, 4, 6, 7}
          chunks = []
          for i in range(70):
              p = (fix_root / f'{i:03d}.bin') if i in fixed else (b64_root / f'{i:03d}.b64')
              if not p.is_file():
                  raise SystemExit(f'MISSING_CHUNK {i:03d}')
              data = p.read_bytes() if i in fixed else base64.b64decode(p.read_text(encoding='ascii').strip(), validate=True)
              expected_len = 4096 if i < 69 else 3716
              if len(data) != expected_len:
                  raise SystemExit(f'CHUNK_LENGTH_MISMATCH {i:03d}: {len(data)} != {expected_len}')
              chunks.append(data)
          payload = b''.join(chunks)
          print('PAYLOAD_BYTES', len(payload))
          print('PAYLOAD_SHA256', hashlib.sha256(payload).hexdigest())
          tar_bytes = brotli.decompress(payload)
          print('TAR_BYTES', len(tar_bytes))
          with tarfile.open(fileobj=io.BytesIO(tar_bytes), mode='r:') as tf:
              for member in tf.getmembers():
                  rel = pathlib.PurePosixPath(member.name)
                  if rel.is_absolute() or '..' in rel.parts or not member.isfile():
                      raise SystemExit(f'UNSAFE_TAR_MEMBER {member.name!r}')
                  target = source_root.joinpath(*rel.parts)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  src = tf.extractfile(member)
                  if src is None:
                      raise SystemExit(f'UNREADABLE_TAR_MEMBER {member.name!r}')
                  target.write_bytes(src.read())
          manifest = json.loads((source_root / 'SOURCE_MANIFEST.json').read_text(encoding='utf-8'))
          if manifest.get('source_tree_sha256') != '842e2b0021d8c374976b01ff81157a4992394c86c94eca8f668a2aab380e290a':
              raise SystemExit('SOURCE_TREE_ID_MISMATCH')
          included = manifest.get('included')
          if not isinstance(included, list) or len(included) != 159 or manifest.get('included_count') != 159:
              raise SystemExit('MANIFEST_COUNT_MISMATCH')
          failures = []
          for record in included:
              rel = pathlib.PurePosixPath(record['path'])
              p = source_root.joinpath(*rel.parts)
              if not p.is_file():
                  failures.append((record['path'], 'MISSING', int(record['bytes']), record['sha256'], None, None))
                  continue
              data = p.read_bytes()
              actual_sha = hashlib.sha256(data).hexdigest()
              if len(data) != int(record['bytes']) or actual_sha != record['sha256']:
                  failures.append((record['path'], 'MISMATCH', int(record['bytes']), record['sha256'], len(data), actual_sha))
          print('MANIFEST_TOTAL', len(included))
          print('MISMATCH_COUNT', len(failures))
          for item in failures:
              print('MISMATCH', json.dumps(item, ensure_ascii=False))
          if failures:
              raise SystemExit(f'EXACT_SOURCE_MISMATCH_COUNT={len(failures)}')
          print('SOURCE_MANIFEST_VERIFIED 159 / 159')
          '@ | Set-Content -Encoding UTF8 .packaging\diagnose_payload.py
          python .packaging\diagnose_payload.py
