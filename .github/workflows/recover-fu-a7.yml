name: Package FU 842e2b Final
on:
  push:
    branches: [package/fu-recover-a7-20260905]
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reconstruction tools
        shell: pwsh
        run: python -m pip install brotli pefile
      - name: Reconstruct exact reviewed source
        shell: pwsh
        run: |
          @'
          import base64,brotli,hashlib,io,json,pathlib,tarfile
          repo=pathlib.Path.cwd(); pkg=repo/'.packaging'; src=repo/'legacy'/'fu-v02-reconnect-preview'
          b64=pkg/'runtime24fresh_b64'; fix=pkg/'runtime24fresh_fix'; fixed={0,1,3,4,6,7}
          chunks=[]
          for i in range(70):
              p=(fix/f'{i:03d}.bin') if i in fixed else (b64/f'{i:03d}.b64')
              if not p.is_file(): raise SystemExit(f'MISSING_BASE_CHUNK {i:03d}')
              d=p.read_bytes() if i in fixed else base64.b64decode(p.read_text('ascii').strip(),validate=True)
              n=4096 if i<69 else 3716
              if len(d)!=n: raise SystemExit(f'BASE_CHUNK_LENGTH {i:03d}: {len(d)} != {n}')
              chunks.append(d)
          base=b''.join(chunks)
          if len(base)!=286340: raise SystemExit(f'BASE_PAYLOAD_SIZE {len(base)}')
          def extract(raw,dest):
              with tarfile.open(fileobj=io.BytesIO(raw),mode='r:') as tf:
                  for m in tf.getmembers():
                      r=pathlib.PurePosixPath(m.name)
                      if r.is_absolute() or '..' in r.parts or not m.isfile(): raise SystemExit(f'UNSAFE_TAR_MEMBER {m.name!r}')
                      out=dest.joinpath(*r.parts); out.parent.mkdir(parents=True,exist_ok=True)
                      f=tf.extractfile(m)
                      if f is None: raise SystemExit(f'UNREADABLE_TAR_MEMBER {m.name!r}')
                      out.write_bytes(f.read())
          extract(brotli.decompress(base),src)
          ov=pkg/'fu842_overlay_b64_12k'; decoded=[]
          for i in range(20):
              if i in (3,10):
                  text=(ov/f'{i:03d}a.b64').read_text('ascii').strip()+(ov/f'{i:03d}b.b64').read_text('ascii').strip()
              else: text=(ov/f'{i:03d}.b64').read_text('ascii').strip()
              expected_chars=12000 if i<19 else 9732
              print('OVERLAY_CHUNK',f'{i:03d}','B64_CHARS',len(text))
              if len(text)!=expected_chars: raise SystemExit(f'OVERLAY_CHUNK_B64_LENGTH {i:03d}: {len(text)} != {expected_chars}')
              try: decoded.append(base64.b64decode(text,validate=True))
              except Exception as e: raise SystemExit(f'OVERLAY_CHUNK_BASE64_INVALID {i:03d}: {e}') from e
          overlay=b''.join(decoded)
          expect='d4eac19786c913f9ac8eae4b7c33327b00d04545a8ad765345595593b7ed1a9c'; sha=hashlib.sha256(overlay).hexdigest()
          print('OVERLAY_BYTES',len(overlay)); print('OVERLAY_SHA256',sha)
          if len(overlay)!=178298: raise SystemExit(f'OVERLAY_SIZE {len(overlay)}')
          if sha!=expect: raise SystemExit('OVERLAY_SHA_MISMATCH')
          ot=brotli.decompress(overlay)
          if len(ot)!=1382400: raise SystemExit(f'OVERLAY_TAR_SIZE {len(ot)}')
          extract(ot,src)
          mf=json.loads((src/'SOURCE_MANIFEST.json').read_text('utf-8')); tree='842e2b0021d8c374976b01ff81157a4992394c86c94eca8f668a2aab380e290a'
          inc=mf.get('included')
          if mf.get('source_tree_sha256')!=tree: raise SystemExit('SOURCE_TREE_ID_MISMATCH')
          if not isinstance(inc,list) or len(inc)!=159 or mf.get('included_count')!=159: raise SystemExit('MANIFEST_COUNT_MISMATCH')
          bad=[]
          for rec in inc:
              r=pathlib.PurePosixPath(rec['path']); p=src.joinpath(*r.parts)
              if r.is_absolute() or '..' in r.parts: raise SystemExit(f'UNSAFE_MANIFEST_PATH {rec["path"]!r}')
              if not p.is_file(): bad.append(f'{rec["path"]}: missing'); continue
              d=p.read_bytes(); h=hashlib.sha256(d).hexdigest()
              if len(d)!=int(rec['bytes']) or h!=rec['sha256']: bad.append(f'{rec["path"]}: bytes={len(d)}/{rec["bytes"]} sha={h}/{rec["sha256"]}')
          if bad:
              print('\n'.join(bad)); raise SystemExit(f'EXACT_SOURCE_MISMATCH_COUNT={len(bad)}')
          (pkg/'FINAL_OVERLAY_SHA256.txt').write_text(sha+'\n',encoding='ascii')
          print('SOURCE_MANIFEST_VERIFIED 159 / 159'); print('SOURCE_TREE_SHA256',tree)
          '@ | Set-Content -Encoding UTF8 .packaging\reconstruct_final.py
          python .packaging\reconstruct_final.py
      - name: Install build requirements
        shell: pwsh
        working-directory: legacy/fu-v02-reconnect-preview
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
      - name: Compile check
        shell: pwsh
        working-directory: legacy/fu-v02-reconnect-preview
        run: python -m compileall -q automation_input_safety.py control_panel.py fishing_profiles.py flash_sync_v02.py fu_reconnect_integration.py manor_runtime.py quick_code_library.py runtime_paths.py settings_bundle.py smart_reconnect.py user_activity_guard.py v02_faithful_game_time.py v02_game_clock_reader.py v02_sync_scheduler.py v02_wheel_hook.py manor_assistant
      - name: Build Windows EXE
        shell: pwsh
        working-directory: legacy/fu-v02-reconnect-preview
        run: python -m PyInstaller --clean --noconfirm fu_preview.spec
      - name: Verify Windows EXE
        shell: pwsh
        run: |
          $exe=Join-Path $env:GITHUB_WORKSPACE 'legacy\fu-v02-reconnect-preview\dist\輔魔.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw '輔魔.exe missing' }
          if ((Get-Item -LiteralPath $exe).Length -le 0) { throw '輔魔.exe empty' }
          $vi=(Get-Item -LiteralPath $exe).VersionInfo
          if ($vi.FileDescription -ne '輔魔' -or $vi.InternalName -ne '輔魔' -or $vi.ProductName -ne '輔魔' -or $vi.OriginalFilename -ne '輔魔.exe') { throw 'VersionInfo name mismatch' }
          if ($vi.FileVersion -ne '0.2.1.0' -or $vi.ProductVersion -ne '0.2.1.0') { throw 'VersionInfo version mismatch' }
          @'
          import hashlib,pathlib,struct,pefile
          exe=pathlib.Path(r'legacy/fu-v02-reconnect-preview/dist/輔魔.exe'); d=exe.read_bytes()
          if d[:2]!=b'MZ': raise SystemExit('MZ_HEADER_MISSING')
          off=struct.unpack_from('<I',d,0x3C)[0]
          if d[off:off+4]!=b'PE\0\0': raise SystemExit('PE_SIGNATURE_MISSING')
          if struct.unpack_from('<H',d,off+4)[0]!=0x8664: raise SystemExit('PE_MACHINE_MISMATCH')
          pe=pefile.PE(str(exe),fast_load=False); texts=[]
          if hasattr(pe,'DIRECTORY_ENTRY_RESOURCE'):
              for t in pe.DIRECTORY_ENTRY_RESOURCE.entries:
                  if (t.id if t.name is None else str(t.name))!=24: continue
                  for n in t.directory.entries:
                      for lang in n.directory.entries:
                          r=lang.data.struct.OffsetToData; s=lang.data.struct.Size; raw=pe.get_memory_mapped_image()[r:r+s]
                          for enc in ('utf-8-sig','utf-16','utf-16le'):
                              try: x=raw.decode(enc)
                              except UnicodeError: continue
                              if '<assembly' in x: texts.append(x); break
          if not texts: raise SystemExit('RT_MANIFEST_MISSING')
          m='\n'.join(texts)
          for needle in ('processorArchitecture="amd64"','requestedExecutionLevel level="asInvoker"','<dpiAware','true/pm','<longPathAware','>true</longPathAware>'):
              if needle not in m: raise SystemExit(f'MANIFEST_ASSERTION_MISSING: {needle}')
          h=hashlib.sha256(d).hexdigest(); o=pathlib.Path('.packaging/FINAL_OVERLAY_SHA256.txt').read_text('ascii').strip()
          info=pathlib.Path(r'legacy/fu-v02-reconnect-preview/dist/BUILD_INFO.txt')
          info.write_text('\n'.join(['source_zip_sha256=748ea8dba2dd194e9d32567f6c0a115213f61b43ed6e99c7fde4fa100b160f68','source_tree_sha256=842e2b0021d8c374976b01ff81157a4992394c86c94eca8f668a2aab380e290a','base_commit=32ad4ae780c8c3b68c4a068aba3fb6c59977466f',f'overlay_sha256={o}',f'exe_sha256={h}',f'exe_bytes={len(d)}','pe_machine=AMD64','rt_manifest=verified'])+'\n',encoding='utf-8')
          print('EXE_BYTES',len(d)); print('EXE_SHA256',h); print('PE_MACHINE AMD64'); print('RT_MANIFEST verified')
          '@ | Set-Content -Encoding UTF8 .packaging\verify_final_exe.py
          python .packaging\verify_final_exe.py
          Get-Content -LiteralPath 'legacy\fu-v02-reconnect-preview\dist\BUILD_INFO.txt'
      - name: Upload 輔魔 EXE
        uses: actions/upload-artifact@v4
        with:
          name: fumagic-842e2b-final
          path: |
            legacy/fu-v02-reconnect-preview/dist/輔魔.exe
            legacy/fu-v02-reconnect-preview/dist/BUILD_INFO.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
