name: Recover FU a7 metadata

on:
  push:
    branches:
      - package/fu-recover-a7-20260905

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install brotli
      - name: Recover tar metadata from verified Brotli prefix
        shell: bash
        run: |
          python - <<'PY'
          import base64, brotli, pathlib
          root = pathlib.Path('.packaging')
          parts = []
          for i in range(4):
              fix = root / 'runtime24fresh_fix' / f'{i:03d}.bin'
              if fix.exists():
                  b = fix.read_bytes()
              else:
                  b64 = (root / 'runtime24fresh_b64' / f'{i:03d}.b64').read_text(encoding='ascii')
                  b = base64.b64decode(b64, validate=True)
              assert len(b) == 4096, (i, len(b))
              parts.append(b)
          d = brotli.Decompressor()
          out = d.process(b''.join(parts))
          print('PREFIX_COMPRESSED', sum(map(len, parts)))
          print('PREFIX_DECOMPRESSED', len(out))
          pos = 0
          count = 0
          while pos + 512 <= len(out):
              h = out[pos:pos+512]
              if h == b'\0' * 512:
                  break
              name = h[0:100].split(b'\0',1)[0].decode('utf-8','replace')
              try:
                  size = int(h[124:136].rstrip(b'\0 ').decode() or '0', 8)
                  mtime = int(h[136:148].rstrip(b'\0 ').decode() or '0', 8)
              except Exception as e:
                  print('HEADER_PARSE_STOP', pos, repr(e), h[:32].hex())
                  break
              print('TAR_HEADER', count, 'POS', pos, 'NAME', repr(name), 'SIZE', size, 'MTIME', mtime)
              pos += 512 + ((size + 511)//512)*512
              count += 1
          PY
