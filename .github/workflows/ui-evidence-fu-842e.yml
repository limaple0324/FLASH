name: Capture FU 842e2b UI Evidence
on:
  push:
    branches: [package/fu-ui-842e-20260905]
permissions:
  actions: read
  contents: read
jobs:
  capture:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fumagic-842e2b-final
          path: artifact
          github-token: ${{ github.token }}
          repository: limaple0324/FLASH
          run-id: 33972498459
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install capture dependencies
        shell: pwsh
        run: python -m pip install Pillow pywin32
      - name: Verify exact executable
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'artifact\輔魔.exe'
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $exe).Hash.ToLowerInvariant()
          if ($hash -ne '1e279a3bcf66c4db5d513e35c010a9d2ffa76c13f732a53f50314982d5c2d97a') { throw "SHA mismatch: $hash" }
          "exe_sha256=$hash" | Set-Content -Encoding UTF8 artifact\UI_EVIDENCE.txt
      - name: Launch and capture top-level window
        shell: pwsh
        run: |
          @'
          import ctypes
          import os
          import pathlib
          import subprocess
          import time
          from ctypes import wintypes
          from PIL import Image
          import win32con
          import win32gui
          import win32ui
          import win32process

          root = pathlib.Path.cwd()
          artifact = root / 'artifact'
          exe = artifact / '輔魔.exe'
          evidence = artifact / 'UI_EVIDENCE.txt'
          proc = subprocess.Popen([str(exe)])
          time.sleep(12)
          if proc.poll() is not None:
              raise SystemExit(f'輔魔.exe exited early: {proc.returncode}')

          # The launcher can create a second same-name process, so collect all live 輔魔.exe PIDs.
          ps = subprocess.run(
              ['powershell.exe','-NoProfile','-Command',"Get-Process -Name '輔魔' -ErrorAction SilentlyContinue | ForEach-Object { $_.Id }"],
              capture_output=True, text=True, encoding='utf-8', errors='replace'
          )
          pids = {int(x.strip()) for x in ps.stdout.splitlines() if x.strip().isdigit()}
          pids.add(proc.pid)

          user32 = ctypes.windll.user32
          targets = []
          EnumProc = ctypes.WINFUNCTYPE(ctypes.c_bool, wintypes.HWND, wintypes.LPARAM)

          def callback(hwnd, lparam):
              if not user32.IsWindowVisible(hwnd):
                  return True
              _, pid = win32process.GetWindowThreadProcessId(hwnd)
              title = win32gui.GetWindowText(hwnd)
              if pid in pids or ('輔' in title) or ('魔' in title):
                  rect = win32gui.GetWindowRect(hwnd)
                  targets.append((hwnd, pid, title, rect))
              return True

          user32.EnumWindows(EnumProc(callback), 0)

          lines = [evidence.read_text(encoding='utf-8-sig').strip()]
          lines.append('launcher_pid=' + str(proc.pid))
          lines.append('live_fu_pids=' + ','.join(str(x) for x in sorted(pids)))
          lines.append('visible_target_windows=' + str(len(targets)))

          def capture(hwnd, path):
              left, top, right, bottom = win32gui.GetWindowRect(hwnd)
              width = max(1, right-left)
              height = max(1, bottom-top)
              hwnd_dc = win32gui.GetWindowDC(hwnd)
              mfc_dc = win32ui.CreateDCFromHandle(hwnd_dc)
              save_dc = mfc_dc.CreateCompatibleDC()
              bitmap = win32ui.CreateBitmap()
              bitmap.CreateCompatibleBitmap(mfc_dc, width, height)
              save_dc.SelectObject(bitmap)
              try:
                  ok = user32.PrintWindow(hwnd, save_dc.GetSafeHdc(), 2)
                  if not ok:
                      ok = user32.PrintWindow(hwnd, save_dc.GetSafeHdc(), 0)
                  info = bitmap.GetInfo()
                  bits = bitmap.GetBitmapBits(True)
                  image = Image.frombuffer('RGB', (info['bmWidth'], info['bmHeight']), bits, 'raw', 'BGRX', 0, 1)
                  image.save(path)
                  extrema = image.getextrema()
                  return bool(ok), image.size, extrema
              finally:
                  win32gui.DeleteObject(bitmap.GetHandle())
                  save_dc.DeleteDC()
                  mfc_dc.DeleteDC()
                  win32gui.ReleaseDC(hwnd, hwnd_dc)

          for idx, (hwnd, pid, title, rect) in enumerate(targets, 1):
              png = artifact / f'window-{idx:02d}.png'
              ok, size, extrema = capture(hwnd, str(png))
              lines.append(f'window_{idx} pid={pid} hwnd={hwnd} title={title!r} rect={rect} capture_ok={ok} image_size={size} extrema={extrema} file={png.name}')

          evidence.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          print(evidence.read_text(encoding='utf-8'))
          if not targets:
              raise SystemExit('No visible FU window found after launch.')
          if not any((artifact / f'window-{i:02d}.png').is_file() for i in range(1, len(targets)+1)):
              raise SystemExit('No window PNG created.')
          subprocess.run(['powershell.exe','-NoProfile','-Command',"Get-Process -Name '輔魔' -ErrorAction SilentlyContinue | Stop-Process -Force"], check=False)
          '@ | Set-Content -Encoding UTF8 artifact\capture_ui.py
          python artifact\capture_ui.py
      - name: Upload UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fumagic-842e2b-ui-evidence
          path: |
            artifact/UI_EVIDENCE.txt
            artifact/window-*.png
          if-no-files-found: warn
          retention-days: 7
